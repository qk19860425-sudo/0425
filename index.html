<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>報修登記</title>
  <meta name="description" content="示範用的報修登記系統：填表新增報修，查看最近 20 筆報修。">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p class="subtitle">示範系統：請勿填寫真實姓名與地點。</p>
  </header>

  <main>
    <p id="offline" class="message message-error" role="status" hidden>目前離線：送出報修和讀取清單都需要網路，連上網路後請按「重新整理」。</p>
    <div id="install" class="card install" hidden>
      <div>
        <strong>安裝到主畫面</strong>
        <p id="install-hint" class="install-hint" hidden>iPhone／iPad：在 Safari 點下方的「分享」按鈕，再選「加入主畫面」。</p>
      </div>
      <button id="install-button" type="button" class="button install-button" hidden>安裝</button>
    </div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>

      <div id="config-warning" class="message message-error" role="alert" hidden></div>

      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人</label>
          <input id="reporter_name" name="reporter_name" type="text"
                 required maxlength="50" autocomplete="name" placeholder="例如：虛構-林小安">
        </div>

        <div class="field">
          <label for="location">地點或部門</label>
          <input id="location" name="location" type="text"
                 required maxlength="100" placeholder="例如：示範門市A">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="category">類別</label>
            <select id="category" name="category" required>
              <option value="" selected disabled>請選擇</option>
              <option value="設備">設備</option>
              <option value="網路">網路</option>
              <option value="環境">環境</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <fieldset class="field">
            <legend>緊急程度</legend>
            <div class="segmented">
              <input type="radio" id="urgency-low" name="urgency" value="低">
              <label for="urgency-low">低</label>
              <input type="radio" id="urgency-mid" name="urgency" value="中" checked>
              <label for="urgency-mid">中</label>
              <input type="radio" id="urgency-high" name="urgency" value="高">
              <label for="urgency-high">高</label>
            </div>
          </fieldset>
        </div>

        <div class="field">
          <label for="description">問題說明</label>
          <textarea id="description" name="description" rows="4"
                    required maxlength="1000" placeholder="請描述發生的問題"></textarea>
          <div class="hint"><span id="description-count">0</span> / 1000</div>
        </div>

        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>

        <button id="submit-button" type="submit" class="button">送出報修</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-button" type="button" class="button button-secondary">重新整理</button>
      </div>
      <div id="list-message" class="message" role="status" aria-live="polite" hidden></div>
      <ul id="request-list" class="request-list"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
          integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
          crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
