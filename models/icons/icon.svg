<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 原創設計：圓頂造型的金龜車，像組裝模型零件一樣掛在流道上（不含任何車廠標誌） -->
  <rect width="512" height="512" fill="#dc2626"/>
  <!-- 上方流道與兩個澆口 -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <line x1="112" y1="112" x2="400" y2="112" stroke-width="16"/>
    <line x1="214" y1="112" x2="214" y2="176" stroke-width="8"/>
    <line x1="298" y1="112" x2="298" y2="176" stroke-width="8"/>
  </g>
  <!-- 車身：圓頂 -->
  <path d="M112 330 C112 250 168 168 256 168 C344 168 400 250 400 330 Z" fill="#ffffff"/>
  <!-- 前後葉子板 -->
  <ellipse cx="170" cy="330" rx="66" ry="54" fill="#ffffff"/>
  <ellipse cx="342" cy="330" rx="66" ry="54" fill="#ffffff"/>
  <!-- 下車身（填滿兩個葉子板之間） -->
  <rect x="170" y="318" width="172" height="44" fill="#ffffff"/>
  <!-- 車窗 -->
  <path d="M176 262 C184 224 214 202 248 200 L248 262 Z" fill="#dc2626"/>
  <path d="M264 200 C298 202 328 224 338 262 L264 262 Z" fill="#dc2626"/>
  <!-- 車燈、門把 -->
  <circle cx="386" cy="300" r="10" fill="#dc2626"/>
  <rect x="262" y="282" width="26" height="8" rx="4" fill="#dc2626"/>
  <!-- 輪胎 -->
  <circle cx="170" cy="352" r="38" fill="#1f2937"/>
  <circle cx="342" cy="352" r="38" fill="#1f2937"/>
  <circle cx="170" cy="352" r="14" fill="#ffffff"/>
  <circle cx="342" cy="352" r="14" fill="#ffffff"/>
  <!-- 地面 -->
  <line x1="96" y1="396" x2="416" y2="396" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
</svg>
