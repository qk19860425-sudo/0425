<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 原創設計：塑膠模型的「零件框（runner）」上掛著四個零件 -->
  <rect width="512" height="512" fill="#dc2626"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- 外框與十字流道 -->
    <rect x="92" y="92" width="328" height="328" rx="30" stroke-width="22"/>
    <line x1="256" y1="92" x2="256" y2="420" stroke-width="14"/>
    <line x1="92" y1="256" x2="420" y2="256" stroke-width="14"/>
    <!-- 澆口：零件和流道相連的小段 -->
    <line x1="215" y1="174" x2="256" y2="174" stroke-width="8"/>
    <line x1="338" y1="218" x2="338" y2="256" stroke-width="8"/>
    <line x1="174" y1="256" x2="174" y2="294" stroke-width="8"/>
    <line x1="256" y1="338" x2="297" y2="338" stroke-width="8"/>
  </g>
  <!-- 左上：輪胎 -->
  <circle cx="174" cy="174" r="42" fill="#ffffff"/>
  <circle cx="174" cy="174" r="16" fill="#dc2626"/>
  <!-- 右上：機器人頭 -->
  <rect x="300" y="146" width="76" height="66" rx="14" fill="#ffffff"/>
  <circle cx="324" cy="178" r="9" fill="#dc2626"/>
  <circle cx="352" cy="178" r="9" fill="#dc2626"/>
  <line x1="338" y1="146" x2="338" y2="124" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="338" cy="120" r="9" fill="#ffffff"/>
  <!-- 左下：積木 -->
  <rect x="132" y="318" width="84" height="54" rx="8" fill="#ffffff"/>
  <rect x="146" y="300" width="20" height="20" rx="4" fill="#ffffff"/>
  <rect x="182" y="300" width="20" height="20" rx="4" fill="#ffffff"/>
  <!-- 右下：齒輪 -->
  <g transform="translate(338 338)" fill="#ffffff">
    <circle r="30"/>
    <rect x="-9" y="-44" width="18" height="18" rx="3"/>
    <rect x="-9" y="26" width="18" height="18" rx="3"/>
    <rect x="-44" y="-9" width="18" height="18" rx="3"/>
    <rect x="26" y="-9" width="18" height="18" rx="3"/>
    <rect x="-9" y="-44" width="18" height="18" rx="3" transform="rotate(45)"/>
    <rect x="-9" y="26" width="18" height="18" rx="3" transform="rotate(45)"/>
    <rect x="-44" y="-9" width="18" height="18" rx="3" transform="rotate(45)"/>
    <rect x="26" y="-9" width="18" height="18" rx="3" transform="rotate(45)"/>
    <circle r="12" fill="#dc2626"/>
  </g>
</svg>
