<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" preserveAspectRatio="xMidYMax slice">
  <!-- 日本超商店面（天藍色系，只用顏色，沒有商標）：牆、玻璃窗與貨架、自動門、人行道 -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 牆 -->
  <rect width="420" height="260" fill="#f4f7fb"/>
  <rect y="0" width="420" height="10" fill="#1a7fcc"/>
  <!-- 左邊大玻璃窗 -->
  <rect x="10" y="22" width="250" height="196" rx="4" fill="#9fb3c8"/>
  <rect x="16" y="28" width="238" height="184" fill="url(#glass)"/>
  <!-- 貨架：三層，擺上各種顏色的商品 -->
  <g>
    <rect x="22" y="78" width="226" height="5" fill="#9aa9b8"/>
    <rect x="22" y="128" width="226" height="5" fill="#9aa9b8"/>
    <rect x="22" y="178" width="226" height="5" fill="#9aa9b8"/>
    <g fill="#f59e0b"><rect x="26" y="58" width="14" height="20" rx="2"/><rect x="120" y="108" width="14" height="20" rx="2"/><rect x="200" y="158" width="14" height="20" rx="2"/></g>
    <g fill="#ef4444"><rect x="44" y="62" width="12" height="16" rx="2"/><rect x="150" y="62" width="12" height="16" rx="2"/><rect x="60" y="160" width="12" height="18" rx="2"/></g>
    <g fill="#22c55e"><rect x="60" y="56" width="10" height="22" rx="5"/><rect x="74" y="56" width="10" height="22" rx="5"/><rect x="176" y="106" width="10" height="22" rx="5"/><rect x="190" y="106" width="10" height="22" rx="5"/></g>
    <g fill="#3b82f6"><rect x="90" y="60" width="16" height="18" rx="2"/><rect x="30" y="110" width="16" height="18" rx="2"/><rect x="140" y="160" width="16" height="18" rx="2"/></g>
    <g fill="#ec4899"><rect x="112" y="64" width="12" height="14" rx="2"/><rect x="214" y="110" width="12" height="18" rx="2"/><rect x="100" y="162" width="14" height="16" rx="2"/></g>
    <g fill="#facc15"><rect x="170" y="58" width="16" height="20" rx="3"/><rect x="52" y="112" width="18" height="16" rx="3"/><rect x="230" y="160" width="14" height="18" rx="3"/></g>
    <g fill="#ffffff" stroke="#cbd5e1"><rect x="196" y="60" width="18" height="18" rx="2"/><rect x="80" y="110" width="22" height="18" rx="2"/><rect x="30" y="160" width="22" height="18" rx="2"/></g>
    <g fill="#a855f7"><rect x="222" y="62" width="14" height="16" rx="2"/><rect x="160" y="160" width="16" height="18" rx="2"/></g>
  </g>
  <!-- 玻璃反光 -->
  <polygon points="16,28 90,28 16,140" fill="url(#shine)"/>
  <polygon points="150,28 190,28 80,212 40,212" fill="#ffffff" opacity="0.18"/>
  <!-- 自動門 -->
  <rect x="276" y="22" width="134" height="200" rx="4" fill="#9fb3c8"/>
  <rect x="282" y="28" width="122" height="194" fill="url(#glass)"/>
  <line x1="343" y1="28" x2="343" y2="222" stroke="#9fb3c8" stroke-width="3"/>
  <rect x="300" y="110" width="30" height="5" rx="2" fill="#1a7fcc" opacity="0.6"/>
  <rect x="356" y="110" width="30" height="5" rx="2" fill="#1a7fcc" opacity="0.6"/>
  <polygon points="282,28 330,28 282,110" fill="url(#shine)"/>
  <!-- 人行道 -->
  <rect y="222" width="420" height="38" fill="#cfd4da"/>
  <g stroke="#b7bec7" stroke-width="2">
    <line x1="0" y1="240" x2="420" y2="240"/>
    <line x1="60" y1="222" x2="60" y2="260"/><line x1="140" y1="222" x2="140" y2="260"/>
    <line x1="220" y1="222" x2="220" y2="260"/><line x1="300" y1="222" x2="300" y2="260"/><line x1="380" y1="222" x2="380" y2="260"/>
  </g>
</svg>
