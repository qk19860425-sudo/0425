<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" preserveAspectRatio="xMidYMax slice">
  <!-- 韓國超商店面（深藍＋青藍，只用顏色，沒有商標）：玻璃窗與貨架、門、店外的塑膠桌椅與陽傘 -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f7ff"/>
      <stop offset="1" stop-color="#c7e9f8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="420" height="260" fill="#eef3f8"/>
  <rect y="0" width="420" height="10" fill="#00b4e6"/>
  <!-- 玻璃窗 -->
  <rect x="10" y="22" width="270" height="196" rx="4" fill="#0a4aa6"/>
  <rect x="16" y="28" width="258" height="184" fill="url(#glass)"/>
  <g>
    <rect x="22" y="78" width="246" height="5" fill="#8fa3b8"/>
    <rect x="22" y="128" width="246" height="5" fill="#8fa3b8"/>
    <rect x="22" y="178" width="246" height="5" fill="#8fa3b8"/>
    <!-- 冰箱飲料、泡麵、零食 -->
    <g fill="#16a34a"><rect x="28" y="56" width="10" height="22" rx="4"/><rect x="42" y="56" width="10" height="22" rx="4"/><rect x="56" y="56" width="10" height="22" rx="4"/><rect x="200" y="156" width="10" height="22" rx="4"/></g>
    <g fill="#ef4444"><rect x="76" y="60" width="18" height="18" rx="3"/><rect x="98" y="60" width="18" height="18" rx="3"/><rect x="40" y="110" width="20" height="18" rx="3"/><rect x="150" y="160" width="18" height="18" rx="3"/></g>
    <g fill="#f97316"><rect x="124" y="58" width="16" height="20" rx="2"/><rect x="240" y="108" width="16" height="20" rx="2"/><rect x="30" y="160" width="16" height="18" rx="2"/></g>
    <g fill="#facc15"><rect x="148" y="62" width="14" height="16" rx="2"/><rect x="66" y="112" width="14" height="16" rx="2"/><rect x="176" y="160" width="16" height="18" rx="2"/></g>
    <g fill="#0ea5e9"><rect x="170" y="56" width="10" height="22" rx="4"/><rect x="184" y="56" width="10" height="22" rx="4"/><rect x="110" y="106" width="10" height="22" rx="4"/><rect x="124" y="106" width="10" height="22" rx="4"/></g>
    <g fill="#ffffff" stroke="#cbd5e1"><rect x="206" y="60" width="20" height="18" rx="2"/><rect x="86" y="110" width="18" height="18" rx="2"/><rect x="100" y="160" width="22" height="18" rx="2"/></g>
    <g fill="#ec4899"><rect x="232" y="62" width="14" height="16" rx="2"/><rect x="150" y="110" width="14" height="18" rx="2"/><rect x="60" y="162" width="16" height="16" rx="2"/></g>
    <g fill="#8b5cf6"><rect x="250" y="60" width="14" height="18" rx="2"/><rect x="190" y="112" width="20" height="16" rx="2"/><rect x="230" y="160" width="16" height="18" rx="2"/></g>
  </g>
  <polygon points="16,28 92,28 16,140" fill="url(#shine)"/>
  <polygon points="160,28 200,28 90,212 50,212" fill="#ffffff" opacity="0.18"/>
  <!-- 門 -->
  <rect x="294" y="22" width="116" height="200" rx="4" fill="#0a4aa6"/>
  <rect x="300" y="28" width="104" height="194" fill="url(#glass)"/>
  <rect x="384" y="110" width="6" height="34" rx="3" fill="#0a4aa6"/>
  <polygon points="300,28 344,28 300,110" fill="url(#shine)"/>
  <!-- 人行道 -->
  <rect y="222" width="420" height="38" fill="#cdd3da"/>
  <g stroke="#b5bdc7" stroke-width="2">
    <line x1="0" y1="240" x2="420" y2="240"/>
    <line x1="70" y1="222" x2="70" y2="260"/><line x1="150" y1="222" x2="150" y2="260"/>
    <line x1="230" y1="222" x2="230" y2="260"/><line x1="310" y1="222" x2="310" y2="260"/><line x1="390" y1="222" x2="390" y2="260"/>
  </g>
  <!-- 店外的陽傘與塑膠桌椅 -->
  <rect x="246" y="150" width="4" height="96" fill="#64748b"/>
  <path d="M196 156 Q248 112 300 156 Z" fill="#00b4e6"/>
  <path d="M222 156 Q248 120 248 120 Q248 120 274 156 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M196 156 Q248 112 300 156" fill="none" stroke="#0a4aa6" stroke-width="2"/>
  <rect x="218" y="214" width="62" height="6" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="224" y="220" width="4" height="26" fill="#e2e8f0"/><rect x="270" y="220" width="4" height="26" fill="#e2e8f0"/>
  <g fill="#e2e8f0" stroke="#94a3b8">
    <rect x="196" y="222" width="16" height="5" rx="2"/><rect x="198" y="202" width="4" height="22"/><rect x="198" y="227" width="3" height="19"/><rect x="208" y="227" width="3" height="19"/>
    <rect x="286" y="222" width="16" height="5" rx="2"/><rect x="298" y="202" width="4" height="22"/><rect x="287" y="227" width="3" height="19"/><rect x="297" y="227" width="3" height="19"/>
  </g>
</svg>
